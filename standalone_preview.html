      function ParticleCanvas() {
        const canvasRef = useRef(null);
        useEffect(() => {
          const canvas = canvasRef.current;
          if (!canvas) return;
          const ctx = canvas.getContext('2d');
          let width = canvas.width = window.innerWidth;
          let height = canvas.height = window.innerHeight;

          const handleResize = () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
          };
          window.addEventListener('resize', handleResize);

          const particles = [];
          const particleCount = Math.floor(width / 22);

          for (let i = 0; i < particleCount; i++) {
            particles.push({
              x: Math.random() * width,
              y: Math.random() * height,
              radius: Math.random() * 1.5 + 0.5,
              vx: (Math.random() - 0.5) * 0.4,
              vy: (Math.random() - 0.5) * 0.4,
              alpha: Math.random() * 0.5 + 0.2
            });
          }

          let reqId;
          const animate = () => {
            ctx.clearRect(0, 0, width, height);
            for (let i = 0; i < particles.length; i++) {
              let p = particles[i];
              p.x += p.vx; p.y += p.vy;
              if (p.x < 0) p.x = width; if (p.x > width) p.x = 0;
              if (p.y < 0) p.y = height; if (p.y > height) p.y = 0;
              ctx.beginPath();
              ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
              ctx.fillStyle = `rgba(37, 99, 235, ${p.alpha * 0.6})`;
              ctx.fill();
            }
            for (let i = 0; i < particles.length; i++) {
              for (let j = i + 1; j < particles.length; j++) {
                let dx = particles[i].x - particles[j].x;
                let dy = particles[i].y - particles[j].y;
                let dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 110) {
                  ctx.beginPath();
                  ctx.moveTo(particles[i].x, particles[i].y);
                  ctx.lineTo(particles[j].x, particles[j].y);
                  ctx.strokeStyle = `rgba(37, 99, 235, ${0.12 * (1 - dist / 110)})`;
                  ctx.stroke();
                }
              }
            }
            reqId = requestAnimationFrame(animate);
          };
          animate();
          return () => {
            window.removeEventListener('resize', handleResize);
            cancelAnimationFrame(reqId);
          };
        }, []);

        return <canvas id="canvas-particles" ref={canvasRef}></canvas>;
      }

      function Hero() {
        const [typewriterText, setTypewriterText] = useState('');

            "Final-Year B.Tech Student @ Dr. MCET",
            "Machine Learning Student",
            "AI-Powered Product Builder"
          ];
          let wordIdx = 0, charIdx = 0, isDeleting = false, timeoutId;

          function type() {
            const currentWord = words[wordIdx];
            if (isDeleting) {
              setTypewriterText(currentWord.substring(0, charIdx - 1) + '|');
              charIdx--;
            } else {
              setTypewriterText(currentWord.substring(0, charIdx + 1) + '|');
              charIdx++;
            }
            let typeSpeed = isDeleting ? 35 : 75;
            if (!isDeleting && charIdx === currentWord.length) {
              typeSpeed = 2200;
              isDeleting = true;
            } else if (isDeleting && charIdx === 0) {
              isDeleting = false;
              wordIdx = (wordIdx + 1) % words.length;
              typeSpeed = 400;
            }
            timeoutId = setTimeout(type, typeSpeed);
          }
          type();
          return () => clearTimeout(timeoutId);
        }, []);
